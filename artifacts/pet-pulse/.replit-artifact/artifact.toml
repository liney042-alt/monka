kind = "web"
previewPath = "/"
title = "PetPulse"
description = "Prototipo interactivo para gestionar mascotas, simular su ubicación, conectar dueños con proveedores y supervisar alertas desde vistas adaptadas a cada rol."
version = "1.0.0"
id = "artifacts/pet-pulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19293

[services.development]
run = "pnpm --filter @workspace/pet-pulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pet-pulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/pet-pulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19293"
BASE_PATH = "/"
